<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CGPA Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>CGPA Calculator</h1>
    <h1>KPRIET</h1>
    <h2>Department of Electronics and Communication Engineering</h2>

    <p id="error" class="error"></p>

    <label>Department</label>
    <select id="department" onchange="loadSubjects()">
        <option value="">-- Select Department --</option>
        <option value="ECE">ECE</option>
        <option value="AIDS">AI & DATA SCIENCE</option>
        <option value="CSE">COMPUTER SCIENCE</option>
        <option value="BME">BIOMEDICAL ENGINEERING</option>
        <option value="IT">INFORMATION TECHNOLOGY</option>
        <option value="AIML">AI & ML</option>
        <option value="CSBS">COMPUTER SCIENCE AND BUSINESS SYSTEMS</option>
        <option value="EEE">ELECTRICAL AND ELECTRONICS ENGINEERING</option>
        <option value="CH">CHEMICAL ENGINEERING</option>
        <option value="CE">CIVIL ENGINEERING</option>
        <option value="ME">MECHANICAL  ENGINEERING</option>
        <option value="CUSTOM">CUSTOM (Manual)</option>
    </select>

    <label>Subject</label>
    <select id="subject" onchange="handleSubjectChange()">
        <option value="">-- Select Subject --</option>
    </select>

    <!-- Custom subject input -->
    <input type="text" id="customSubject" placeholder="Enter Custom Subject"
           style="display:none;">

    <label>Grade</label>
    <select id="grade">
        <option value="O">O</option>
        <option value="A+">A+</option>
        <option value="A">A</option>
        <option value="B+">B+</option>
        <option value="B">B</option>
        <option value="C">C</option>
    </select>

    <label>Credits</label>
    <input type="number" id="credit" readonly>

    <button onclick="addSubject()">Add Subject</button>

    <table>
        <thead>
            <tr>
                <th>Dept</th>
                <th>Subject</th>
                <th>Grade</th>
                <th>Credits</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="subjectList"></tbody>
    </table>

    <h2>CGPA: <span id="cgpa">0.00</span></h2>

    <button onclick="calculateCGPA()">Calculate CGPA</button>
    <button class="reset" onclick="resetAll()">Reset</button>
</div>

<script src="script.js"></script>
</body>
</html>
